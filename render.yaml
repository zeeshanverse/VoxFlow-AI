services:
  - type: web
    name: voxflow-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: PIPER_TTS_URL
        sync: false
      - key: PIPER_TTS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_THINKING_LEVEL
        value: low
      - key: FRONTEND_ORIGIN
        sync: false


  - type: web
    name: voxflow-piper
    runtime: docker
    rootDir: piper
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PIPER_TTS_TOKEN
        sync: false
