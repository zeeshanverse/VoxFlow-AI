spring.application.name=voxflow-assistant
server.port=${PORT:8080}

# =========================
# Database
# =========================
# Read by DataSourceConfig. DB_URL may be jdbc:postgresql://... or postgresql://user:pass@host/db
voxflow.db.url=${DB_URL:jdbc:postgresql://localhost:5432/voxflow}
voxflow.db.username=${DB_USERNAME:postgres}
voxflow.db.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# =========================
# Multipart
# =========================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# =========================
# JWT
# =========================
voxflow.jwt.secret=${JWT_SECRET:change_me_change_me_change_me_change_me}

# =========================
# Frontend
# =========================
voxflow.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# =========================
# AssemblyAI
# =========================
assemblyai.api-key=${ASSEMBLYAI_API_KEY:}

# =========================
# ElevenLabs
# =========================
elevenlabs.api-key=${ELEVENLABS_API_KEY:}
elevenlabs.voice-id=${ELEVENLABS_VOICE_ID:}
elevenlabs.model-id=${ELEVENLABS_MODEL_ID:eleven_multilingual_v2}

# =========================
# OpenAI
# =========================
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

# =========================
# Gemini
# =========================
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}